name: Release Build & Deploy

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      run_staging_certification:
        description: "Run the secret-backed PostgreSQL/provider certification against the staging environment"
        required: true
        default: false
        type: boolean
      deploy_ref:
        description: "Existing release tag (vX.Y.Z, reachable from main) to deploy to production; leave empty to deploy nothing"
        required: false
        default: ""
        type: string

# Read-only by default; only the `release` job gets write access.
permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://placeholder:placeholder@localhost:5432/placeholder
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "npm"
      - name: Assert supported Node.js runtime
        run: node -e "if (!process.versions.node.startsWith('24.')) { throw new Error('Release certification requires Node.js 24'); }"
      - name: Install dependencies
        run: npm ci
      - name: Generate Prisma client
        run: npx --no-install prisma generate
      - name: Release certification preflight
        run: npm run release:check
        env:
          RELEASE_CERTIFICATION_REPORT: QA-report/release-certification.json
      - name: Validate Prisma schema
        run: npx --no-install prisma validate --schema=prisma/schema.prisma
      - name: Lint
        run: npm run lint
        env:
          NEXT_PUBLIC_ENABLE_TELEMETRY: "false"
          ENABLE_TELEMETRY: "false"
      - name: Check env vars are documented in .env.example
        run: npm run docs:env-check
      - name: Check API route prefixes are in the route index
        run: npm run docs:route-check
      - name: Check relative links in Markdown docs
        run: npm run docs:link-check
      - name: Doc check script tests
        run: npm run test:doc-checks
      - name: Typecheck
        run: npm run typecheck
      - name: Typecheck e2e sources
        run: npm run typecheck:e2e
        env:
          NEXT_PUBLIC_ENABLE_TELEMETRY: "false"
          ENABLE_TELEMETRY: "false"
      - name: Unit tests
        run: npm run test
        env:
          NEXT_PUBLIC_ENABLE_TELEMETRY: "false"
          ENABLE_TELEMETRY: "false"
      # [INT] scenarios against an in-memory pglite-server started by the
      # suite itself (E2E_DB_PORT+10); the job's placeholder DATABASE_URL is
      # never used (the harness injects and guards its own loopback URL).
      - name: Integration tests (PGlite)
        run: npm run test:integration
        env:
          NEXT_PUBLIC_ENABLE_TELEMETRY: "false"
          ENABLE_TELEMETRY: "false"
      # Plain production build (no e2e stamp). The browser suite, including the
      # critical contract spec (tagged @smoke), runs in the e2e-smoke job
      # against its own `npm run e2e:build`.
      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_ENABLE_TELEMETRY: "false"
          ENABLE_TELEMETRY: "false"
      - name: Upload release certification evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: release-certification-${{ github.run_id }}
          path: |
            QA-report
            test-results
          if-no-files-found: warn

  # Local-DB smoke tier: in-memory PGlite, provider stub and `next start` on an
  # e2e build, all started by playwright.config.ts (webServer). Includes the
  # critical browser contract spec (@smoke). Playwright's globalTimeout is
  # 15 min (E2E_TIER=smoke) so the artifacts still upload inside the 20 min job.
  e2e-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: postgresql://placeholder:placeholder@localhost:5432/placeholder
      NEXT_PUBLIC_ENABLE_TELEMETRY: "false"
      ENABLE_TELEMETRY: "false"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: ".nvmrc"
          cache: "npm"
      - name: Assert supported Node.js runtime
        run: node -e "if (!process.versions.node.startsWith('24.')) { throw new Error('The e2e suite requires Node.js 24'); }"
      - name: Install dependencies
        run: npm ci
      # Until upgrade Phase 7 adds a postinstall hook.
      - name: Generate Prisma client
        run: npx --no-install prisma generate
      - name: Resolve Playwright version
        id: playwright
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      # https://playwright.dev/docs/ci: browsers are keyed on the exact
      # @playwright/test version; OS packages are never cached.
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}-chromium
      - name: Install Playwright Chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
      - name: Install Playwright system dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium
      # next build with the e2e NEXT_PUBLIC_* values and .next/e2e-build.json.
      - name: E2E build
        run: npm run e2e:build
      # Added by Step 24 of .plans/e2e-scenarios.md; skipped until the script exists.
      - name: E2E coverage check
        if: hashFiles('scripts/e2e-coverage-check.mjs') != ''
        run: node scripts/e2e-coverage-check.mjs
      - name: E2E smoke tier
        run: npm run test:e2e:smoke
        env:
          E2E_TIER: smoke
          E2E_WORKSPACE_AUTH_MODE: enforce
      - name: Per-spec durations
        if: always()
        run: node scripts/e2e-junit-durations.mjs
      - name: Upload e2e smoke report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-smoke-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            QA-report
            test-results
          retention-days: 7
          if-no-files-found: warn

  # semantic-release on pushes to main, after both gates. It publishes
  # vX.Y.Z (release commit with the bumped package.json and CHANGELOG.md, the
  # tag and a GitHub Release) only when feat/fix/breaking commits landed since
  # the last v* tag; `published` and `version` tell deploy whether to run.
  # Tags pushed with GITHUB_TOKEN start no workflow, so deploy is chained
  # here instead of on a tag trigger. GITHUB_TOKEN can push the release
  # commit because main is unprotected; branch protection would need a
  # bypass for github-actions or a PAT (docs/DEPLOYMENT.md).
  # .releaserc.json turns off the GitHub plugin's issue/PR comments and
  # labels: the tag is pushed before that plugin runs, so a failure there
  # would leave a tagged release that never deploys. Only `contents: write`
  # is needed. If a release is tagged but `deploy` does not run, deploy the
  # tag with workflow_dispatch `deploy_ref` (docs/DEPLOYMENT.md).
  release:
    needs: [build-and-test, e2e-smoke]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: release
      cancel-in-progress: false
    outputs:
      published: ${{ steps.publish.outputs.published }}
      version: ${{ steps.publish.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "npm"
      - name: Install dependencies
        run: npm ci
      # Without a reachable v* base tag semantic-release would publish v1.0.0,
      # so the run is a no-op until the seed tag exists.
      - name: Semantic Release
        id: publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if ! git describe --tags --match 'v[0-9]*' --abbrev=0 >/dev/null 2>&1; then
            echo "published=false" >> "$GITHUB_OUTPUT"
            echo "::warning::no v* base tag reachable from HEAD, skipping release"
            exit 0
          fi
          npx --no-install semantic-release
          # @semantic-release/git commits locally and tags that commit, so HEAD
          # carries a v* tag exactly when a release was published.
          tag="$(git tag --points-at HEAD --list 'v[0-9]*' | head -n 1)"
          if [ -n "$tag" ]; then
            echo "published=true" >> "$GITHUB_OUTPUT"
            echo "version=${tag}" >> "$GITHUB_OUTPUT"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi

  # Two ways in:
  # - push to main: `release` published a version; deploy its tag.
  # - workflow_dispatch with `deploy_ref`: an operator redeploys an existing
  #   vX.Y.Z tag (a tagged release whose deploy never ran or failed, or a
  #   rollback). `release` is skipped on dispatch, hence `!cancelled()`; the
  #   gates run on the dispatched branch, but this path does not depend on
  #   them because the tag was gated when it was released and is rebuilt
  #   below. A dispatch without `deploy_ref` deploys nothing.
  deploy:
    needs: release
    if: >-
      !cancelled() && (
        (github.event_name == 'push' && needs.release.result == 'success' && needs.release.outputs.published == 'true') ||
        (github.event_name == 'workflow_dispatch' && inputs.deploy_ref != '')
      )
    runs-on: ubuntu-latest
    # Holds PRODUCTION_DATABASE_URL, VERCEL_TOKEN, VERCEL_ORG_ID and
    # VERCEL_PROJECT_ID. The environment and its secrets are created by the
    # repository owner (docs/DEPLOYMENT.md "Production prerequisites");
    # deployment branches restricted to main, no required reviewers, so
    # deploys stay fully automatic.
    environment: production
    # Two deploys must never run `prisma migrate deploy` in parallel.
    concurrency:
      group: production-deploy
      cancel-in-progress: false
    outputs:
      deployment_url: ${{ steps.vercel.outputs.url }}
    env:
      DATABASE_URL: postgresql://placeholder:placeholder@localhost:5432/placeholder
    steps:
      # Inputs go through env, never inline into the script.
      - name: Resolve the tag to deploy
        id: target
        env:
          EVENT_NAME: ${{ github.event_name }}
          RUN_REF: ${{ github.ref }}
          RELEASE_TAG: ${{ needs.release.outputs.version }}
          DEPLOY_REF: ${{ inputs.deploy_ref }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            if [ "$RUN_REF" != "refs/heads/main" ]; then
              echo "::error::Run the deploy_ref dispatch from main (Use workflow from: main); this run is on ${RUN_REF}."
              exit 1
            fi
            tag="$DEPLOY_REF"
          else
            tag="$RELEASE_TAG"
          fi
          if ! [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::'${tag}' is not a release tag of the form vX.Y.Z."
            exit 1
          fi
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
      # The release commit: it carries the bumped package.json and CHANGELOG.md.
      # A full-ref checkout fails when the tag does not exist; full history is
      # fetched for the reachability check below.
      - uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ steps.target.outputs.tag }}
          fetch-depth: 0
      - name: Verify the tag is on main
        env:
          TAG: ${{ steps.target.outputs.tag }}
        run: |
          if ! git rev-parse --verify --quiet "refs/tags/${TAG}^{commit}" >/dev/null; then
            echo "::error::Tag ${TAG} does not exist."
            exit 1
          fi
          if ! git merge-base --is-ancestor "refs/tags/${TAG}" origin/main; then
            echo "::error::Tag ${TAG} is not reachable from main; only released tags are deployed."
            exit 1
          fi
          echo "Deploying ${TAG} ($(git rev-parse --short "refs/tags/${TAG}^{commit}"))"
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "npm"
      - name: Assert supported Node.js runtime
        run: node -e "if (!process.versions.node.startsWith('24.')) { throw new Error('Release certification requires Node.js 24'); }"
      - name: Install dependencies
        run: npm ci
      - name: Generate Prisma client
        run: npx --no-install prisma generate
      # Every secret is checked before anything touches production, and the
      # message names only the missing secrets, never values.
      - name: Check deployment secrets
        env:
          PRODUCTION_DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          missing=()
          for name in PRODUCTION_DATABASE_URL VERCEL_TOKEN VERCEL_ORG_ID VERCEL_PROJECT_ID; do
            if [ -z "${!name}" ]; then
              missing+=("$name")
            fi
          done
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "::error::Missing secrets in the 'production' GitHub environment: ${missing[*]}. Nothing was migrated or deployed; see docs/DEPLOYMENT.md (Production prerequisites)."
            exit 1
          fi
      # The build gate runs before migrations, so a build failure has no
      # production side effect.
      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_ENABLE_TELEMETRY: "false"
          ENABLE_TELEMETRY: "false"
      # Migrations run before `vercel deploy`, so a failed migration stops the
      # job and never ships code ahead of its schema.
      # PRODUCTION_DATABASE_URL must be the direct (non-pooled) connection
      # string: schema.prisma has no directUrl, and a PgBouncer/transaction-
      # pooled URL breaks the advisory lock `migrate deploy` takes.
      # The repo is public: Prisma prints the database host in its output
      # (and in connection errors), so the host is masked in the log first.
      - name: Apply database migrations
        env:
          DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
        run: |
          node -e '
            let u;
            try { u = new URL(process.env.DATABASE_URL); } catch { console.error("PRODUCTION_DATABASE_URL is not a valid URL"); process.exit(1); }
            if (u.hostname) console.log("::add-mask::" + u.hostname);
          '
          npx --no-install prisma migrate status || true
          npx --no-install prisma migrate deploy
      # `vercel deploy` prints the deployment URL on stdout; post-deploy-tests
      # runs the @staging tier after it. VERCEL_ORG_ID and VERCEL_PROJECT_ID
      # select the project because `.vercel/` is not committed. The CLI version
      # is pinned so a new release cannot change the deploy unannounced.
      - name: Deploy to Vercel
        id: vercel
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          url="$(npx --yes vercel@62.0.0 deploy --prod --token="$VERCEL_TOKEN")"
          echo "url=${url}" >> "$GITHUB_OUTPUT"

  # @staging tier: no database, no webServer, no provider stub
  # (playwright.config.ts with PLAYWRIGHT_BASE_URL set). The account comes
  # from the `staging` environment's E2E_STAGING_USER_* secrets. It targets
  # the STAGING deployment, never the production URL `deploy` publishes: the
  # @staging specs write data (workspaces, invoices, Slack endpoints) and need
  # sandbox provider keys. (Open question for the owner: see Atlas report.)
  post-deploy-tests:
    # `release` is listed so needs.release.outputs is readable here.
    needs: [release, deploy]
    if: needs.release.outputs.published == 'true'
    environment: staging
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PLAYWRIGHT_BASE_URL: ${{ secrets.STAGING_NEXTAUTH_URL }}
      E2E_TIER: staging
      E2E_STAGING_USER_EMAIL: ${{ secrets.E2E_STAGING_USER_EMAIL }}
      E2E_STAGING_USER_PASSWORD: ${{ secrets.E2E_STAGING_USER_PASSWORD }}
      E2E_STAGING_INBOX: ${{ vars.E2E_STAGING_INBOX }}
      E2E_STAGING_SLACK_WEBHOOK_URL: ${{ secrets.E2E_STAGING_SLACK_WEBHOOK_URL }}
      E2E_STAGING_CRON_SECRET: ${{ secrets.STAGING_CRON_SECRET }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: ".nvmrc"
          cache: "npm"
      - name: Assert supported Node.js runtime
        run: node -e "if (!process.versions.node.startsWith('24.')) { throw new Error('Release certification requires Node.js 24'); }"
      - name: Install dependencies
        run: npm ci
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: E2E staging tier
        run: npm run test:e2e:staging
      - name: Upload e2e staging report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-post-deploy-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            QA-report
            test-results
          retention-days: 14
          if-no-files-found: warn

  staging-certification:
    if: github.event_name == 'workflow_dispatch' && inputs.run_staging_certification == true
    environment: staging
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
      NEXTAUTH_URL: ${{ secrets.STAGING_NEXTAUTH_URL }}
      NEXTAUTH_SECRET: ${{ secrets.STAGING_NEXTAUTH_SECRET }}
      CRON_SECRET: ${{ secrets.STAGING_CRON_SECRET }}
      STRIPE_SECRET_KEY: ${{ secrets.STAGING_STRIPE_SECRET_KEY }}
      STRIPE_WEBHOOK_SECRET: ${{ secrets.STAGING_STRIPE_WEBHOOK_SECRET }}
      NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: ${{ secrets.STAGING_STRIPE_PUBLISHABLE_KEY }}
      MIDTRANS_SERVER_KEY: ${{ secrets.STAGING_MIDTRANS_SERVER_KEY }}
      MIDTRANS_CLIENT_KEY: ${{ secrets.STAGING_MIDTRANS_CLIENT_KEY }}
      NEXT_PUBLIC_MIDTRANS_CLIENT_KEY: ${{ secrets.STAGING_MIDTRANS_CLIENT_KEY }}
      RESEND_API_KEY: ${{ secrets.STAGING_RESEND_API_KEY }}
      RESEND_FROM_EMAIL: ${{ secrets.STAGING_RESEND_FROM_EMAIL }}
      RESEND_WEBHOOK_SECRET: ${{ secrets.STAGING_RESEND_WEBHOOK_SECRET }}
      RELEASE_CERTIFICATION_REPORT: QA-report/release-certification.json
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "npm"
      - name: Assert supported Node.js runtime
        run: node -e "if (!process.versions.node.startsWith('24.')) { throw new Error('Release certification requires Node.js 24'); }"
      - name: Install dependencies
        run: npm ci
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      # Secret-backed checks plus the no-DB contract gate (runCriticalGates).
      # The local-DB smoke tier never runs here; it runs only in e2e-smoke.
      - name: Run staging certification
        run: npm run release:certify
      - name: E2E staging tier
        run: npm run test:e2e:staging
        env:
          PLAYWRIGHT_BASE_URL: ${{ secrets.STAGING_NEXTAUTH_URL }}
          E2E_TIER: staging
          E2E_STAGING_USER_EMAIL: ${{ secrets.E2E_STAGING_USER_EMAIL }}
          E2E_STAGING_USER_PASSWORD: ${{ secrets.E2E_STAGING_USER_PASSWORD }}
          E2E_STAGING_INBOX: ${{ vars.E2E_STAGING_INBOX }}
          E2E_STAGING_SLACK_WEBHOOK_URL: ${{ secrets.E2E_STAGING_SLACK_WEBHOOK_URL }}
          E2E_STAGING_CRON_SECRET: ${{ secrets.STAGING_CRON_SECRET }}
      - name: Upload staging certification evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: staging-certification-${{ github.run_id }}
          path: |
            QA-report
            test-results
          if-no-files-found: warn
